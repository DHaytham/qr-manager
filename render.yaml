services:
  # Your existing frontend service
  - type: web
    name: nfc-card-manager
    env: static
    buildCommand: npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # New backend service
  - type: web
    name: nfc-card-manager-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        value: "REDACTED_MONGODB_URI"
      - key: BASE_URL
        value: "https://qr-manager-8591.onrender.com"
      - key: FRONTEND_URL
        value: "https://qr-code-manager-q5zd.onrender.com"